<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SATA Technology - Demo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .hero { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 80px 20px; text-align: center; }
        .hero h1 { font-size: 3rem; margin-bottom: 20px; }
        .hero p { font-size: 1.2rem; max-width: 600px; margin: 0 auto 30px; opacity: 0.9; }
        .cta-btn { display: inline-block; padding: 15px 40px; background: white; color: #667eea; border-radius: 30px; text-decoration: none; font-weight: 600; }
        .features { padding: 60px 20px; max-width: 1200px; margin: 0 auto; }
        .features h2 { text-align: center; font-size: 2rem; margin-bottom: 40px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; }
        .card { padding: 30px; border-radius: 12px; border: 1px solid #eee; }
        .card:hover { box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .card h3 { margin-bottom: 15px; color: #667eea; }
    </style>
</head>
<body>
    <section class="hero">
        <h1>SATA Technology</h1>
        <p>Next-generation decentralized verification and attestation platform</p>
        <a href="#demo" class="cta-btn">Try Demo</a>
    </section>
    <section class="features">
        <h2>Key Features</h2>
        <div class="grid">
            <div class="card"><h3>Verifiable Attestations</h3><p>Create and verify on-chain attestations.</p></div>
            <div class="card"><h3>Lightning Fast</h3><p>Sub-second verification times.</p></div>
            <div class="card"><h3>Cross-chain Compatible</h3><p>Works across multiple networks.</p></div>
        </div>
    </section>
</body>
</html>
